services:
  fts-dev:
    build:
      context: .
      dockerfile: docker/humble/Dockerfile
    image: multi-fts:humble
    container_name: multi-fts-humble
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-0}
    volumes:
      - ./:/workspaces/multi-FTS
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/shm:/dev/shm
    working_dir: /workspaces/multi-FTS
    stdin_open: true
    tty: true
